[package]
name = "swiftslate"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A lightweight, system-wide AI writing assistant"
repository = "https://github.com/JCVERSA/cd"
publish = false

[dependencies]
serde_json = "1.0"

[lib]
name = "swiftslate"
path = "src/lib.rs"

[[bin]]
name = "swiftslate"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
