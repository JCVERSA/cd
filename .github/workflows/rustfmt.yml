name: Rustfmt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format and lock
    if: github.ref_name == 'arena/33e46336-cd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out session branch
        uses: actions/checkout@v7
        with:
          ref: arena/33e46336-cd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and generate dependency lock
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- src Cargo.lock; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src Cargo.lock
          git commit -m 'style: apply rustfmt and lock dependencies'
          git push origin HEAD:arena/33e46336-cd
