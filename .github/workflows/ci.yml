name: CI

on:
  push:
    branches:
      - arena/33e46336-cd
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Core / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh Rust formatting
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format provider phase"
            git push origin HEAD:arena/33e46336-cd
          fi

      - name: Run tests
        shell: bash
        run: |
          set +e
          cargo test --locked --all-targets 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            log=$(tail -n 200 cargo-test.log)
            {
              echo '## Linux test failure'
              echo '```text'
              echo "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            escaped=${log//'%'/'%25'}
            escaped=${escaped//$'\n'/'%0A'}
            escaped=${escaped//$'\r'/'%0D'}
            echo "::error title=Linux cargo test failed::$escaped"
          fi
          exit "$status"

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  windows:
    name: Prototype / Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run tests
        shell: pwsh
        run: |
          cargo test --locked --all-targets 2>&1 | Tee-Object -FilePath cargo-test.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $log = (Get-Content cargo-test.log -Tail 250) -join "`n"
            @"
          ## Windows test/build failure
          ```text
          $log
          ```
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
            $escaped = $log.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows cargo test failed::$escaped"
          }
          exit $status

      - name: Run Clippy
        shell: pwsh
        run: |
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath cargo-clippy.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $log = (Get-Content cargo-clippy.log -Tail 250) -join "`n"
            $escaped = $log.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Clippy failed::$escaped"
          }
          exit $status

      - name: Build optimized prototype
        run: cargo build --locked --release

      - name: Package artifact and record measurements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'artifacts/swiftslate-windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'target/release/swiftslate.exe' "$package/swiftslate.exe"
          Copy-Item 'README.md' "$package/README.md"
          Copy-Item 'LICENSE' "$package/LICENSE"
          Compress-Archive -Path "$package/*" -DestinationPath 'artifacts/swiftslate-windows-x64.zip' -Force

          $exe = Get-Item "$package/swiftslate.exe"
          $zip = Get-Item 'artifacts/swiftslate-windows-x64.zip'
          $hash = (Get-FileHash "$package/swiftslate.exe" -Algorithm SHA256).Hash
          @"
          ## Windows prototype measurements

          | Metric | Value |
          |---|---:|
          | Release EXE | $($exe.Length) bytes |
          | Distribution ZIP | $($zip.Length) bytes |
          | SHA-256 | ``$hash`` |
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          @{
            executable_bytes = $exe.Length
            zip_bytes = $zip.Length
            sha256 = $hash
          } | ConvertTo-Json | Set-Content 'artifacts/measurements.json'

          Write-Output "::notice title=Windows prototype measurements::EXE $($exe.Length) bytes; distribution ZIP $($zip.Length) bytes; SHA-256 $hash"

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v7
        with:
          name: swiftslate-windows-x64
          path: |
            artifacts/swiftslate-windows-x64.zip
            artifacts/measurements.json
          if-no-files-found: error
          retention-days: 14
