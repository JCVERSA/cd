name: CI

on:
  push:
    branches:
      - arena/33e46336-cd
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Core / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run tests
        shell: bash
        run: |
          set +e
          cargo test --all-targets 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Linux test failure'
              echo '```text'
              tail -n 200 cargo-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            {
              echo '## Rustfmt changes required'
              echo '```diff'
              git diff --no-ext-diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Prototype / Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run tests
        shell: pwsh
        run: |
          cargo test --all-targets 2>&1 | Tee-Object -FilePath cargo-test.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            @"
          ## Windows test/build failure
          ```text
          $((Get-Content cargo-test.log -Tail 250) -join "`n")
          ```
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $status

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build optimized prototype
        run: cargo build --release

      - name: Package artifact and record measurements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'artifacts/swiftslate-windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'target/release/swiftslate.exe' "$package/swiftslate.exe"
          Copy-Item 'README.md' "$package/README.md"
          Copy-Item 'LICENSE' "$package/LICENSE"
          Compress-Archive -Path "$package/*" -DestinationPath 'artifacts/swiftslate-windows-x64.zip' -Force

          $exe = Get-Item "$package/swiftslate.exe"
          $zip = Get-Item 'artifacts/swiftslate-windows-x64.zip'
          $hash = (Get-FileHash "$package/swiftslate.exe" -Algorithm SHA256).Hash
          @"
          ## Windows prototype measurements

          | Metric | Value |
          |---|---:|
          | Release EXE | $($exe.Length) bytes |
          | Distribution ZIP | $($zip.Length) bytes |
          | SHA-256 | ``$hash`` |
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          @{
            executable_bytes = $exe.Length
            zip_bytes = $zip.Length
            sha256 = $hash
          } | ConvertTo-Json | Set-Content 'artifacts/measurements.json'

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v7
        with:
          name: swiftslate-windows-x64
          path: |
            artifacts/swiftslate-windows-x64.zip
            artifacts/measurements.json
          if-no-files-found: error
          retention-days: 14
