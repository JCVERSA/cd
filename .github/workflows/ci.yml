name: SwiftSlate desktop CI

on:
  push:
    branches:
      - arena/33e46336-cd
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m py_compile SwiftSlate.pyw dashboard_server.py provider_catalog.py secure_config.py text_styles.py ui_host.py

      - name: Install interface dependencies
        working-directory: desktop/ui
        run: npm ci

      - name: Type-check, test, audit, and build interface
        working-directory: desktop/ui
        run: |
          npm run typecheck
          npm test
          npm audit --audit-level=moderate
          npm run build

  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and smoke-test SwiftSlate
        shell: pwsh
        run: |
          try {
            & ./desktop/build_windows.ps1 *>&1 | Tee-Object -FilePath windows-build.log
            if (-not $?) { throw 'Windows build script failed.' }
          } catch {
            $tail = ((Get-Content windows-build.log -Tail 160 -ErrorAction SilentlyContinue) -join "`n")
            @"
          ## Windows build failure
          ```text
          $tail
          ```
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$escaped"
            throw
          }

      - name: Install, verify, and uninstall package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Resolve-Path 'desktop/release/SwiftSlate-Setup-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'SwiftSlateInstalled'
          $install = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $smoke = Start-Process (Join-Path $installDir 'SwiftSlate.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed application self-test exited with $($smoke.ExitCode)." }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }

      - name: Record installer measurements
        shell: pwsh
        run: |
          $installer = Get-Item 'desktop/release/SwiftSlate-Setup-x64.exe'
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          @"
          ## SwiftSlate Windows installer

          | Metric | Value |
          |---|---:|
          | Installer | $($installer.Length) bytes |
          | SHA-256 | ``$hash`` |
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Output "::notice title=SwiftSlate installer::Size $($installer.Length) bytes; SHA-256 $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSlate-Windows-x64
          path: |
            desktop/release/SwiftSlate-Setup-x64.exe
            desktop/release/SwiftSlate-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
